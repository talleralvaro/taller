<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taller Álvaro</title>
<link rel="manifest" href="./manifest.json?v=2">
<link rel="icon" href="./icons/icon-v2-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon-v2.png">
<meta name="theme-color" content="#0A0A0A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Taller">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0A; --bg2:#141414; --card:#1D1D1D; --border:#2D2D2D;
  --text:#F5F5F5; --text2:#9A9A9A; --muted:#6E6E6E;
  --accent:#ECECEC; --accent-bg:rgba(255,255,255,.08); --accent-ink:#0A0A0A;
  --danger:#FF6B5B; --danger-bg:rgba(255,107,91,.16);
  --success:#7BC99A; --success-bg:rgba(123,201,154,.14);
  --radius:14px;
  --font-sans:'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:var(--bg); color:var(--text); min-height:100vh;
  font-family:var(--font-sans);
  -webkit-font-smoothing:antialiased;
}
.hidden{display:none !important;}
.mono{font-family:var(--font-mono); letter-spacing:.01em;}
.wrap{max-width:640px; margin:0 auto; padding:20px 16px 80px;}
h1{font-size:19px; font-weight:600; letter-spacing:-.01em;}
h2{font-size:13px; font-weight:600; color:var(--text2); text-transform:uppercase; letter-spacing:.04em;}
input, textarea{
  width:100%; background:var(--bg2); border:1px solid var(--border); color:var(--text);
  border-radius:10px; padding:11px 13px; font-size:15px; outline:none; font-family:inherit;
  transition:border-color .15s;
}
input:focus, textarea:focus{border-color:var(--accent);}
textarea{resize:vertical; min-height:60px;}
label{display:block; font-size:12px; color:var(--muted); margin:14px 0 6px; font-weight:500;}
label:first-child{margin-top:0;}
button{
  font-family:inherit; cursor:pointer; border-radius:10px; border:1px solid var(--border);
  background:var(--card); color:var(--text); font-size:14px; padding:10px 16px; font-weight:500;
  transition:background .15s, border-color .15s, transform .1s;
}
button:active{transform:scale(.97);}
button:hover{border-color:#3A3A3A;}
.btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600;}
.btn-primary:hover{background:#D4D4D4;}
.btn-danger{color:var(--danger); border-color:var(--danger-bg);}
.btn-danger:hover{background:var(--danger-bg);}
.btn-icon{padding:7px 9px; font-size:13px; line-height:1;}
.btn-block{width:100%;}
.btn-ghost{background:transparent; border:none; color:var(--accent); padding:6px 0; font-size:13.5px; font-weight:500;}
.btn-new-client{
  width:100%; background:var(--card); border:1px solid var(--border); color:var(--text);
  border-radius:30px; padding:8px 18px 8px 8px; font-weight:500; font-size:14px;
  display:flex; align-items:center; gap:10px; justify-content:center;
}
.btn-new-client-icon{
  width:26px; height:26px; border-radius:50%; background:var(--accent); color:var(--accent-ink);
  display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:700; flex-shrink:0;
}

/* login */
#loginScreen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
.login-box{width:100%; max-width:340px;}
.login-box h1{text-align:center; margin-bottom:28px; font-size:22px;}
.login-box input{margin-bottom:10px;}
.error{color:var(--danger); font-size:13px; margin-top:10px; min-height:16px;}

/* header */
header{
  display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:10; background:var(--bg);
  margin:-20px -16px 18px; padding:20px 16px 14px; border-bottom:1px solid var(--border);
}
header .actions{display:flex; gap:8px;}
#debtorsBtn.active{background:var(--danger-bg); border-color:var(--danger); color:var(--danger);}
.badge{
  display:inline-block; margin-left:6px; background:var(--danger); color:#fff;
  font-size:11px; border-radius:9px; padding:1px 6px; min-width:16px; text-align:center;
}

/* search */
.search-wrap{margin-bottom:14px;}
#searchInput{background:var(--bg2) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="%23ACA89C" stroke-width="2"><circle cx="6.5" cy="6.5" r="5"/><line x1="10.5" y1="10.5" x2="15" y2="15"/></svg>') no-repeat 12px center; padding-left:36px;}

/* client list */
.client-card{
  background:var(--card); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:var(--radius);
  padding:13px 14px 13px 12px; margin-bottom:10px; display:flex; align-items:center; gap:12px; cursor:pointer;
  transition:border-color .15s;
}
.client-card:hover{border-top-color:#3A3A3A; border-right-color:#3A3A3A; border-bottom-color:#3A3A3A;}
.client-info{flex:1; min-width:0;}
.client-info .name{font-weight:600; font-size:14.5px;}
.client-info .sub{font-size:12.5px; color:var(--text2); margin-top:1px;}
.card-right{display:flex; align-items:center; gap:10px; flex-shrink:0;}
.debt-pill{
  font-size:11.5px; background:var(--danger-bg); color:var(--danger); padding:3px 9px;
  border-radius:8px; white-space:nowrap; font-weight:500;
}
.empty{color:var(--muted); font-size:14px; text-align:center; padding:40px 10px;}
.wa-btn{
  width:30px; height:30px; border-radius:50%; background:transparent; padding:0;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  border:none; overflow:hidden; opacity:.92; transition:opacity .15s, transform .1s;
}
.wa-btn img{width:100%; height:100%; display:block; object-fit:contain;}
.wa-btn:hover{opacity:1; border-color:transparent;}

/* ficha */
#backBtn{
  color:var(--text2); background:var(--bg); border:none; border-radius:0;
  position:sticky; top:0; z-index:10; margin:-20px -16px 16px; padding:20px 16px 14px;
  border-bottom:1px solid var(--border); width:calc(100% + 32px); text-align:left; font-size:14px;
}
.client-card-big{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px 18px; margin-bottom:20px;
}
.client-card-big .row1{display:flex; align-items:center; gap:12px; margin-bottom:10px;}
.client-card-big .name{font-weight:600; font-size:16px;}
.client-card-big .phone-line{display:flex; align-items:center; gap:8px; margin-top:2px; flex-wrap:wrap;}
.client-card-big .phone{font-size:13px; color:var(--text2);}
.client-card-big .row2{
  border-top:1px solid var(--border); padding-top:10px;
  display:flex; align-items:center; gap:22px;
}
.client-card-big .row2 .auto-line{margin-bottom:10px;}
.client-card-big .row2 .wa-btn{margin-left:auto;}
.client-card-big .auto-line{padding-top:10px; border-top:1px solid var(--border); margin-bottom:10px;}
.field-label{font-size:11px; color:var(--muted);}
.field-value{font-size:13.5px; margin-top:2px;}
.card-actions{display:flex; gap:6px; margin-left:auto;}

.visits-header{display:grid; grid-template-columns:7fr 3fr; gap:8px; margin-bottom:14px;}
.visits-header button{padding:9px 8px; font-size:13px; white-space:nowrap;}
.visit-card{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:14px 16px; margin-bottom:12px;
}
.visit-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
.visit-date{font-size:12.5px; color:var(--text2);}
.visit-km{font-size:11.5px; background:var(--accent-bg); color:var(--accent); padding:2px 8px; border-radius:8px; margin-top:6px; display:inline-block;}
.detail-row{display:flex; justify-content:space-between; font-size:13.5px; padding:5px 0; color:var(--text);}
.detail-row .d{color:var(--text2);}
.visit-notas{font-size:13px; color:var(--text2); background:var(--bg2); border-radius:8px; padding:9px 11px; margin:6px 0 4px; white-space:pre-wrap;}
.visit-nums{margin:2px 0 8px;}
.visit-nums div{display:flex; justify-content:space-between; font-size:13.5px; color:var(--text2); padding:5px 0;}
.visit-nums div span:last-child{color:var(--text);}
.visit-total{
  border-top:1px solid var(--border); padding-top:8px; display:flex; justify-content:space-between;
  font-size:14px; font-weight:500; margin-bottom:8px;
}
.visit-pay{
  border-radius:8px; padding:8px 10px; display:flex; justify-content:space-between; font-size:12.5px;
}
.visit-pay.paid{background:var(--success-bg); color:var(--success);}
.visit-pay.debt{background:var(--danger-bg); color:var(--danger);}

/* modal */
.modal-bg{
  position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:flex-end;
  justify-content:center; z-index:50;
}
@media(min-width:520px){.modal-bg{align-items:center;}}
.modal{
  background:var(--bg2); border:1px solid var(--border); border-radius:16px 16px 0 0;
  width:100%; max-width:480px; max-height:88vh; overflow-y:auto; padding:20px 20px 24px;
}
@media(min-width:520px){.modal{border-radius:16px;}}
.modal h2{color:var(--text); font-size:17px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.modal-close{background:transparent; border:none; color:var(--text2); font-size:22px; line-height:1; padding:2px 4px;}
.modal-actions{
  display:flex; gap:10px; margin:20px -20px -24px; padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));
  position:sticky; bottom:-1px; background:var(--bg2); border-top:1px solid var(--border);
}
.modal-actions button{flex:1;}
.totalPreview{
  background:var(--accent-bg); color:var(--accent); border-radius:10px; padding:10px 13px;
  font-size:14px; font-weight:500; margin-top:14px; display:flex; justify-content:space-between;
}
.input-check-wrap{position:relative;}
.input-check-wrap input{padding-right:40px;}
.check-icon{
  position:absolute; right:12px; top:50%; transform:translateY(-50%); font-size:15px; font-weight:700;
}
.check-icon.ok{color:var(--success);}
.check-icon.bad{color:var(--danger);}
.two-cols{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.two-cols > div{min-width:0;}
.two-cols input{min-width:0;}
.detail-item{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
.detail-item .detDesc{flex:1; min-width:0;}
.detail-item .detRep{width:92px; flex-shrink:0; font-size:13.5px; padding:11px 10px; text-align:right;}
.detail-item .rm{
  background:transparent; border:none; color:var(--muted); font-size:18px; line-height:1;
  padding:4px 2px; flex-shrink:0;
}
.pdf-modal{max-width:600px;}
.pdf-preview{background:#fff; color:#1a1a1a; border-radius:10px; overflow:hidden; max-height:62vh; overflow-y:auto; border:1px solid var(--border);}
.pv-title{background:#fff; padding:6px 22px; display:flex; align-items:center; justify-content:flex-end;}
.pv-logo{height:40px; width:auto; object-fit:contain; display:block;}
.pv-divider{border-top:1px solid #e6e6e6; margin:0 22px;}
.pv-body{padding:15px 18px;}
.pv-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.pv-label{font-size:8.5px; color:#999; text-transform:uppercase; letter-spacing:.03em; margin-bottom:2px;}
.pv-value{font-size:11.5px; font-weight:500;}
.pv-sub{font-size:9.5px; color:#777; margin-top:1px;}
.pv-table{width:100%; border-collapse:collapse; margin-top:11px;}
.pv-table td{padding:6px 10px; border-bottom:1px solid #eee; font-size:10px;}
.pv-table td.r{text-align:right;}
.pv-thead td{background:#f0f0f0; font-weight:700; font-size:8px; color:#666; padding:8px 10px; letter-spacing:.08em;}
.pv-notas{background:#f5f5f5; border-radius:8px; padding:8px 10px; font-size:9.5px; color:#555; margin-top:10px; white-space:pre-wrap; font-style:italic;}
.pv-totals{margin-top:11px; border-top:2px solid #eee; padding-top:8px;}
.pv-total-row{display:flex; justify-content:space-between; font-size:10px; color:#666; padding:3px 0;}
.pv-total-row.big{font-size:12px; font-weight:700; color:#1a1a1a;}
.pv-total-row.debt{color:#c0392b; font-weight:500;}
.pv-footer{padding:11px 18px 16px; text-align:center; display:flex; justify-content:center; gap:8px; font-size:8px; color:#999;}
.pv-footer .sep{color:#ddd;}
.wa-share-btn{background:var(--success); border-color:var(--success); color:#fff; font-weight:500;}
.wa-share-btn:hover{background:#0b5744;}

/* logo */
.login-logo{width:240px; max-width:80%; height:auto; object-fit:contain; display:block; margin:0 auto 34px;}
.header-title{display:flex; align-items:center; gap:10px;}
.header-logo{height:40px; width:auto; object-fit:contain; display:block; flex-shrink:0;}
#appLoader{position:fixed;inset:0;z-index:9999;background:#0A0A0A;display:flex;align-items:center;justify-content:center;transition:opacity .4s ease}
#appLoader.out{opacity:0;pointer-events:none}
#appLoader img{width:68px;height:68px;animation:gearSpin 1.5s linear infinite}
@keyframes gearSpin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="appLoader"><img src="images/logo-gear.webp" alt=""></div>

<div id="loginScreen" class="screen hidden">
  <div class="login-box">
    <img class="login-logo" src="images/logo-wordmark-light.webp" alt="Taller Álvaro">
    <input id="loginEmail" type="email" placeholder="Email" autocomplete="username">
    <input id="loginPass" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button id="loginBtn" class="btn-primary btn-block">Ingresar</button>
    <p class="error" id="loginError"></p>
  </div>
</div>

<div id="mainScreen" class="screen">
  <div class="wrap">
    <header>
      <div class="header-title">
        <img class="header-logo" src="images/logo-wordmark-light.webp" alt="Taller Álvaro">
      </div>
      <div class="actions">
        <button id="debtorsBtn">Deudores<span class="badge hidden" id="debtorsCount">0</span></button>
        <button id="logoutBtn" class="btn-icon">Salir</button>
      </div>
    </header>
    <div class="search-wrap">
      <input id="searchInput" placeholder="Buscar por nombre o apellido">
    </div>
    <button id="newClientBtn" class="btn-new-client" style="margin-bottom:16px;"><span class="btn-new-client-icon">+</span>Nuevo cliente</button>
    <div id="clientList"></div>
  </div>
</div>

<div id="fichaScreen" class="screen hidden">
  <div class="wrap">
    <button id="backBtn">← Volver</button>
    <div id="clientCard"></div>
    <div class="visits-header">
      <button id="newVisitBtn" class="btn-primary">Nueva visita</button>
      <button id="newPaymentBtn">Nuevo pago</button>
    </div>
    <div id="visitsList"></div>
  </div>
</div>

<div id="modalRoot"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBjxBmNOL72N2r4QzlT6MQUNooNvEivFss",
  authDomain: "talleralvaro.firebaseapp.com",
  projectId: "talleralvaro",
  storageBucket: "talleralvaro.firebasestorage.app",
  messagingSenderId: "951924407222",
  appId: "1:951924407222:web:1661b2d0e482c167a1df17"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
// Cache offline de Firestore: la segunda vez que se abre, los datos salen del dispositivo al instante
db.enablePersistence({synchronizeTabs:true}).catch(()=>{});

let allClients = [];
let currentClientId = null;
let currentVisits = [];
let deudoresOnly = false;
let unsubClients = null, unsubVisits = null;
let detailCount = 0;

/* ---------- LOGO (precarga para el remito) ---------- */
const logoReady = new Promise(resolve => {
  const img = new Image();
  img.onload = resolve;
  img.onerror = resolve;
  img.src = 'images/logo-remito-black.webp';
});

const $ = id => document.getElementById(id);
const norm = s => (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const money = n => '$' + Math.round(n||0).toLocaleString('es-AR');
const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fmtDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${parseInt(d)} ${meses[parseInt(m)-1]} ${y}`;
}
function fmtFileDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}-${m}-${y.slice(2)}`;
}
function visitFilename(c, v){
  return `${c.nombre} ${c.apellido} ${fmtFileDate(v.fecha)}.png`;
}
function initials(nombre, apellido){
  return ((nombre[0]||'')+(apellido[0]||'')).toUpperCase();
}

/* ---------- TELÉFONO ---------- */
function cleanPhone(raw){
  let d = (raw||'').replace(/\D/g,'');
  if(d.startsWith('0')) d = d.slice(1);
  d = d.replace(/^(\d{2,4})15/, '$1');
  return d;
}
function isValidPhone(raw){
  const d = cleanPhone(raw);
  return d.length >= 8 && d.length <= 11;
}
function waLink(raw){
  return `https://wa.me/549${cleanPhone(raw)}`;
}

/* ---------- INPUTS CON FORMATO ---------- */
function attachMoneyInput(el, initial){
  el.dataset.raw = initial ? String(Math.round(initial)) : '';
  el.value = initial ? money(initial) : '';
  el.addEventListener('input', () => {
    const digits = el.value.replace(/\D/g,'');
    el.dataset.raw = digits;
    el.value = digits ? money(parseInt(digits)) : '';
  });
}
function moneyValue(el){ return parseInt(el.dataset.raw||'0')||0; }

function attachKmInput(el, initial){
  el.dataset.raw = initial ? String(Math.round(initial)) : '';
  el.value = initial ? parseInt(initial).toLocaleString('es-AR') : '';
  el.addEventListener('input', () => {
    const digits = el.value.replace(/\D/g,'');
    el.dataset.raw = digits;
    el.value = digits ? parseInt(digits).toLocaleString('es-AR') : '';
  });
}
function kmValue(el){ return parseInt(el.dataset.raw||'0')||0; }

/* ---------- AUTH ---------- */
$('loginBtn').onclick = () => {
  $('loginError').textContent = '';
  auth.signInWithEmailAndPassword($('loginEmail').value.trim(), $('loginPass').value)
    .catch(err => { $('loginError').textContent = 'Email o contraseña incorrectos.'; });
};
$('logoutBtn').onclick = () => auth.signOut();

// Si ya había sesión iniciada, no mostramos el login mientras Firebase confirma
try{
  if(localStorage.getItem('ta_logged') !== '1') $('mainScreen').classList.add('hidden');
  else $('loginScreen').classList.add('hidden');
}catch(e){ $('mainScreen').classList.add('hidden'); }

function hideLoader(){
  const l=$('appLoader'); if(!l||l.dataset.done) return;
  l.dataset.done='1'; l.classList.add('out'); setTimeout(()=>l.remove(),450);
}
setTimeout(hideLoader,6000);
auth.onAuthStateChanged(user => {
  try{ localStorage.setItem('ta_logged', user ? '1' : '0'); }catch(e){}
  if(user){
    $('loginScreen').classList.add('hidden');
    $('mainScreen').classList.remove('hidden');
    listenClients();
  } else {
    $('mainScreen').classList.add('hidden');
    $('fichaScreen').classList.add('hidden');
    $('loginScreen').classList.remove('hidden');
    hideLoader();
    if(unsubClients) unsubClients();
    if(unsubVisits) unsubVisits();
  }
});

/* ---------- CLIENTS ---------- */
function listenClients(){
  unsubClients = db.collection('clientes').onSnapshot(snap => {
    allClients = snap.docs.map(d => ({id:d.id, ...d.data()}));
    try{ localStorage.setItem('ta_clients', JSON.stringify(allClients)); }catch(e){}
    renderClientList();
    if(currentClientId) renderClientCard();
    hideLoader();
  });
}

function renderClientList(){
  const q = norm($('searchInput').value);
  let list = allClients;
  if(deudoresOnly) list = list.filter(c => (c.totalDebe||0) > 0);
  if(q) list = list.filter(c => norm(c.nombre+' '+c.apellido).includes(q));
  list = list.slice().sort((a,b) => (a.apellido||'').localeCompare(b.apellido||''));

  const debtCount = allClients.filter(c => (c.totalDebe||0) > 0).length;
  const badge = $('debtorsCount');
  if(debtCount > 0){ badge.textContent = debtCount; badge.classList.remove('hidden'); }
  else badge.classList.add('hidden');

  const el = $('clientList');
  if(list.length === 0){
    el.innerHTML = `<div class="empty">${deudoresOnly ? 'No hay clientes con deuda.' : 'No se encontraron clientes.'}</div>`;
    return;
  }
  el.innerHTML = list.map(c => `
    <div class="client-card" data-id="${c.id}">
      <div class="client-info">
        <div class="name">${c.nombre} ${c.apellido}</div>

function openPaymentModal(){

      <label>Fecha</label><input id="pFecha" type="date" value="${today}">
      <label>Pagó</label><input id="pMonto" class="mono" inputmode="numeric" placeholder="$0">
      <p class="error" id="pError"></p>
      <div class="modal-actions">
        <button id="pSave" class="btn-primary">Guardar</button>
      </div>
    </div></div>`;
  attachMoneyInput($('pMonto'), 0);
  $('pClose').onclick = closeModal;
  $('pSave').onclick = async () => {
    const monto = moneyValue($('pMonto'));
    if(monto <= 0){ $('pError').textContent = 'Ingresá un monto mayor a $0.'; return; }
    await applyPayment(currentClientId, monto);
    closeModal();
  };
}

async function applyPayment(clientId, monto){
  const snap = await db.collection('clientes').doc(clientId).collection('visitas')
    .orderBy('fecha','asc').get();
  const batch = db.batch();
  let restante = monto;
  snap.docs.forEach(doc => {
    if(restante <= 0) return;
    const v = doc.data();
    const debe = v.debe||0;
    if(debe <= 0) return;
    const aplicado = Math.min(debe, restante);
    restante -= aplicado;
    batch.update(doc.ref, { pago: (v.pago||0) + aplicado, debe: debe - aplicado });
  });
  await batch.commit();
  await recomputeDebt(clientId);
}

  patInput.addEventListener('input', () => {

    patInput.value = patInput.value.toUpperCase();
    patInput.setSelectionRange(pos, pos);

    const nombre = $('mNombre').value.trim(), apellido = $('mApellido').value.trim();

async function deleteClient(id){
  const visitasSnap = await db.collection('clientes').doc(id).collection('visitas').get();
  const batch = db.batch();
  visitasSnap.forEach(d => batch.delete(d.ref));
  batch.delete(db.collection('clientes').doc(id));
  await batch.commit();
  currentClientId = null;
  $('fichaScreen').classList.add('hidden');
  $('mainScreen').classList.remove('hidden');
  window.scrollTo(0, 0);

      <p class="error" id="vError"></p>
      <div class="modal-actions">
        <button id="vSave" class="btn-primary">Guardar</button>
      </div>
    </div></div>`;
  $('vClose').onclick = closeModal;

  attachKmInput($('vKm'), v?.km);
  attachMoneyInput($('vMano'), v?.manoObra);
  attachMoneyInput($('vPago'), v?.pago);

  const detailsList = $('detailsList');
  function renderDetailRows(){
    detailsList.innerHTML = detalles.map((d,i) => detailRowHtml(i, d.descripcion, d.repuestos)).join('');
    detalles.forEach((d,i) => {
      const repEl = detailsList.querySelector(`.detRep[data-idx="${i}"]`);
      attachMoneyInput(repEl, d.repuestos);
      repEl.addEventListener('input', () => {
        detalles[i].repuestos = moneyValue(repEl);
        updateTotal();
      });
      detailsList.querySelector(`.detDesc[data-idx="${i}"]`).addEventListener('input', (e) => {
        detalles[i].descripcion = e.target.value;
      });
    });
    detailsList.querySelectorAll('[data-rm]').forEach(btn => {
      btn.onclick = () => {
        if(detalles.length <= 1) return;
        detalles.splice(parseInt(btn.dataset.rm), 1);
        renderDetailRows();
        updateTotal();
      };
    });
  }
  renderDetailRows();

  $('addDetailBtn').onclick = () => {
    detalles.push({descripcion:'', repuestos:0});
    renderDetailRows();
    updateTotal();
  };

  function updateTotal(){
    let repTotal = 0;
    detailsList.querySelectorAll('.detRep').forEach(el => { repTotal += moneyValue(el); });
    const mano = moneyValue($('vMano'));
    $('vTotalPreview').textContent = money(repTotal + mano);
  }
  $('vMano').addEventListener('input', updateTotal);
  updateTotal();

  $('vSave').onclick = async () => {
    const fecha = $('vFecha').value;
    if(!fecha){ $('vError').textContent = 'Elegí una fecha.'; return; }
    const detallesOut = [];
    detailsList.querySelectorAll('.detail-item').forEach(item => {
      const idx = item.dataset.idx;
      const desc = item.querySelector('.detDesc').value.trim();
      const rep = moneyValue(item.querySelector('.detRep'));
      if(desc || rep) detallesOut.push({descripcion:desc, repuestos:rep});
    });
    const manoObra = moneyValue($('vMano'));
    const pago = moneyValue($('vPago'));
    const repTotal = detallesOut.reduce((s,d) => s + (d.repuestos||0), 0);
    const total = repTotal + manoObra;
    const debe = Math.max(0, total - pago);
    const data = {
      fecha, km: kmValue($('vKm')),
      detalles: detallesOut,
      notas: $('vNotas').value.trim(),
      manoObra, pago, total, debe
    };
    if(v){
      await db.collection('clientes').doc(currentClientId).collection('visitas').doc(v.id).update(data);
    } else {
      data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      await db.collection('clientes').doc(currentClientId).collection('visitas').add(data);
    }
    await recomputeDebt(currentClientId);
    closeModal();
  };
}

async function deleteVisit(id){

async function recomputeDebt(clientId){
  const snap = await db.collection('clientes').doc(clientId).collection('visitas').get();
  let totalDebe = 0;
  snap.forEach(d => totalDebe += (d.data().debe||0));
  await db.collection('clientes').doc(clientId).update({totalDebe});
}

function loadHtml2canvas(){
  if(window.html2canvas) return Promise.resolve();
  return new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    sc.onload = res; sc.onerror = rej;
    document.head.appendChild(sc);
  });
}

async function buildVisitPNG(){
  await loadHtml2canvas();
  // Capturamos el elemento de la vista previa que ya está visible en el modal
  // (en vez de un clon oculto fuera de pantalla, que en algunos navegadores
  // móviles se renderiza en blanco). Como ya está en pantalla, las fuentes
  // y la imagen del logo ya están cargadas.
  const el = $('pdfPreviewEl');
  if(!el) return null;
  const prevMaxHeight = el.style.maxHeight, prevOverflow = el.style.overflowY;
  el.style.maxHeight = 'none';
  el.style.overflowY = 'visible';
  await new Promise(res => requestAnimationFrame(() => requestAnimationFrame(res)));
  const canvas = await html2canvas(el, { scale:2, backgroundColor:'#ffffff', useCORS:true });
  el.style.maxHeight = prevMaxHeight;
  el.style.overflowY = prevOverflow;
  return new Promise(resolve => canvas.toBlob(blob => resolve(blob), 'image/png'));
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}
